# NBV environment v2 (D-030, D-036). Changing anything here bumps ENV_VERSION (src/nbv/env.py).
coverage_target: 0.95          # primary coverage of the variant's real reachable union (D-023, D-028)
k_max: {48: 24, 128: 40}       # pass budget per episode, by candidate-set size (128: 32 -> 40, D-036)

reward:
  alpha_s: 50.0                # shaping weight, seconds per unit coverage: alpha * (discount * C' - C)
  beta_move: 1.0               # per second of arm motion
  gamma_scan: 1.0              # per second of scanning
  success_bonus_s: 250.0       # once, at the step that reaches coverage_target
  discount: 1.0                # used inside the shaping term; set to the learner's discount if < 1
  terminal_potential_zero: true  # option (i): Phi = 0 at episode end; false = ablation (ii)
  reward_scale: 1.0            # multiplies the whole reward

pose_id: 0                     # part pose on the table; only 0 (as loaded) is precomputed (Plan 003)

paths:
  robot: data/cache/robot/nominal
  visibility: data/cache/visibility
