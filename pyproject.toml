[project]
name = "nbv"
version = "0.1.0"
description = "RL-based next-best-view scan planning for a robot-mounted line-laser profilometer"
authors = [
    { name = "Yasin Ekici", email = "120124129+YasinEkici@users.noreply.github.com" }
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "open3d>=0.20.0",
    "pyyaml>=6.0.3",
    "rtree>=1.4.1",
    "scipy>=1.18.1",
    "thingi10k>=1.5.0",
    "trimesh>=5.2.0",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:dash"
