[project]
name = "nbv"
version = "0.1.0"
description = "RL-based next-best-view scan planning for a robot-mounted line-laser profilometer"
authors = [
    { name = "Yasin Ekici", email = "120124129+YasinEkici@users.noreply.github.com" }
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "gymnasium>=1.4.0",
    "numpy>=2.5.4",
    "open3d>=0.20.0",
    "ortools>=9.15.6755",
    "pyyaml>=6.0.3",
    "roboticstoolbox-python>=1.5.0",
    "rtree>=1.4.1",
    "sb3-contrib>=2.9.2",
    "scipy>=1.18.1",
    "thingi10k>=1.5.0",
    "torch>=2.11.0",
    "trimesh>=5.2.0",
]

[project.optional-dependencies]
demo = [
    "plotly==7.1.0",
    "pycollada==0.9.3",
    "viser==1.1.1",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "psutil>=7.2.2",
    "pytest>=9.2.0",
]
palette = [
    "colorspacious>=1.1.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:dash"
filterwarnings = ["ignore:builtin type (SwigPyPacked|SwigPyObject|swigvarlink) has no __module__ attribute:DeprecationWarning"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
